spring:
  application:
    name: material-recognition-gateway
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8081

multimodal:
  provider: openai-compatible
  base-url: ""
  api-key: ""
  model: qwen3.6-35b-a3b
  timeout-seconds: 60
  max-pdf-pages: 3
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:4173
    - http://127.0.0.1:4173
